<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ArtCraft Toolbox app icon: a toolbox in the Studio accent violet on the Studio dark tile.
       Original work, MIT OR Apache-2.0 (assets/app-icon/README.md). The canonical master: every
       rendered size comes from this file (packaging/icons.sh). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6bdff"/>
      <stop offset="1" stop-color="#a194fb"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8cfa"/>
      <stop offset="1" stop-color="#7363ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- the tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- a soft glow behind the toolbox -->
  <ellipse cx="256" cy="300" rx="200" ry="150" fill="#8b7cf6" opacity="0.10"/>
  <!-- the handle -->
  <path d="M190 182 V152 a66 66 0 0 1 132 0 V182" fill="none" stroke="#e8e6f6" stroke-width="28" stroke-linecap="round"/>
  <!-- the lid -->
  <rect x="88" y="168" width="336" height="92" rx="32" fill="url(#lid)"/>
  <rect x="88" y="168" width="336" height="46" rx="32" fill="url(#shine)"/>
  <!-- the body -->
  <rect x="88" y="244" width="336" height="170" rx="36" fill="url(#body)"/>
  <!-- the seam between lid and body -->
  <rect x="88" y="244" width="336" height="16" fill="#131316" opacity="0.38"/>
  <!-- the latch -->
  <rect x="224" y="226" width="64" height="60" rx="16" fill="#e8e6f6"/>
  <rect x="244" y="252" width="24" height="20" rx="6" fill="#7363ea"/>
  <!-- the feet -->
  <rect x="124" y="406" width="52" height="18" rx="9" fill="#5b4dd6"/>
  <rect x="336" y="406" width="52" height="18" rx="9" fill="#5b4dd6"/>
</svg>

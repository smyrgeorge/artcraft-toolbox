<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <!-- The DMG's Finder window background (660 x 400 pt; README.md here). Finder draws the icon
       labels in black, so the field under both icons (ArtCraft Toolbox.app at 326,205 and
       Applications at 574,205, 128 pt boxes) stays light. No text: nothing here needs a font, so
       every machine renders the same pixels. Original work, MIT OR Apache-2.0. -->
  <rect width="660" height="400" fill="#efe9dc"/>
  <!-- the Studio dark band on the left, with the toolbox mark -->
  <rect width="190" height="400" fill="#4a6f9b"/>
  <rect x="186" width="4" height="400" fill="#0b0b0c"/>
  <!-- the app icon, linked (not copied) from its master; resvg resolves the path from this file -->
  <image href="../../../assets/app-icon/artcraft-toolbox.svg" x="26" y="110" width="138" height="138"/>
  <!-- the arrow from the app to Applications, between the two icon boxes (clear of both) -->
  <path d="M412 205 H480" fill="none" stroke="#4a6f9b" stroke-width="10" stroke-linecap="round"/>
  <path d="M470 180 L500 205 L470 230" fill="none" stroke="#4a6f9b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

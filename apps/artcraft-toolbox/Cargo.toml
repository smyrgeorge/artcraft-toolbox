[package]
name = "artcraft-toolbox"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "artcraft-toolbox"
description = "ArtCraft Toolbox: install, update and launch the Crafting Apps"
build = "build.rs"

[lints]
workspace = true

[dependencies]
artcraft-toolbox-engine = { workspace = true }
artcraft-toolbox-ui-egui = { workspace = true }
# The control channel's transport primitives (tokens, bounded frames, reply budgets).
artcraft-toolbox-automation = { workspace = true }
serde_json = { workspace = true }
# `links`: release-note and GitHub links open in the browser.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
log = { workspace = true }
# The menu-bar / tray icon. From the authors of muda (PhotoCraft's macOS menu bar), on the same
# muda 0.21. Linux uses ksni (StatusNotifierItem over D-Bus): no GTK.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# OS notifications for new versions (macOS Notification Center, Windows toasts, D-Bus on Linux).
notify-rust = "4.18"

# eframe's own winit (same 0.30 line), only for its safe macOS event-loop option: a menu-bar app
# without a Dock icon (`ActivationPolicy::Accessory`, set through eframe's `event_loop_builder`).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }

[build-dependencies]
# Icon + VERSIONINFO for artcraft-toolbox.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[package]
name = "artcraft-toolbox-cli"
description = "Headless ArtCraft Toolbox: list apps, check for updates, install, run engine commands"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "artcraft_toolbox_cli"
path = "src/lib.rs"

[[bin]]
name = "artcraft-toolbox-cli"
path = "src/main.rs"

[dependencies]
artcraft-toolbox-engine = { workspace = true }
# `serve` (the JSON-lines control protocol) and `mcp` (the MCP server).
artcraft-toolbox-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
sha2 = "0.10"
# The toolbox's own package kind and version in the self-update test.
artcraft-toolbox-release = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for artcraft-toolbox-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
